name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/move-plan-builder-iphone-pNs6g
      - claude/move-plan-checklist-app-rfmznn
  # Manual trigger. Pushes authored by a GitHub App don't start workflow runs,
  # so without this the site can only redeploy on a human push — and a merge
  # that should have triggered one didn't. This makes a deploy runnable on
  # demand from the Actions tab, or via the API, from any branch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
