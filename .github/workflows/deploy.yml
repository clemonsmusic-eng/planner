name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/move-plan-builder-iphone-pNs6g
  # Manual trigger, so a deploy can be run on demand from the Actions tab
  # instead of only on push. Pick the default branch when running it — the
  # github-pages environment only accepts deployments from there.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Both are read at build time and baked into the bundle. Until the
      # secrets exist they come through empty, and an empty pair is what tells
      # the app to run on the device with no sign-in — so this is inert until
      # the day it is wanted, and needs no second commit to switch on.
      #
      # The anon key belongs in the bundle: it identifies the project and
      # nothing more, and row-level security is what protects the data behind
      # it. The service_role key must never appear here.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
