name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/move-plan-builder-iphone-pNs6g
  # Manual trigger, so a deploy can be run on demand from the Actions tab
  # instead of only on push. Pick the default branch when running it — the
  # github-pages environment only accepts deployments from there.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
